---
all:
  children:

    fortigate:
      vars:
        ansible_connection: httpapi
        ansible_network_os: fortinet.fortios.fortios
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_httpapi_port: 8443
        ansible_command_timeout: 90
        vdom: root

      hosts:
        FGT-ROG-TOWER:
          ansible_host: 192.168.71.158

    mikrotik:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: community.routeros.routeros
        ansible_user: ansible
        ansible_command_timeout: 60

      hosts:
        MT-HOTSPOT:
          ansible_host: 192.168.71.157

    core_switch:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_command_timeout: 180
        ansible_connect_timeout: 60
        ansible_network_cli_ssh_type: paramiko
        ansible_paramiko_use_rsa_sha2_algorithms: false

      hosts:
        CORE-SW:
          ansible_host: 192.168.71.155

    
    wireless_ac:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_command_timeout: 120
        ansible_connect_timeout: 60
        ansible_network_cli_ssh_type: libssh

      hosts:
        WLC-ROG-TOWER:
          ansible_host: 192.168.71.156

    monitoring:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ vault_zabbix_ssh_username }}"
      hosts:
        ZABBIX:
          ansible_host: 192.168.71.159
          monitoring_ip: 192.168.60.10
