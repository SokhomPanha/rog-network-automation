---
- name: Backup core-switch using the established Cisco connection
  hosts: core_switch
  gather_facts: false
  vars_files:
    - vars.yml
  tags: [backup]
  pre_tasks:
    - name: Require intentional device connections
      ansible.builtin.assert:
        that:
          - allow_device_connections | default(false) | bool
          - not ansible_check_mode
        fail_msg: "Set allow_device_connections=true to collect real device data. Check mode is not verification."
      tags: [always]
  tasks:
    - name: Backup Cisco device
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../shared/tasks/cisco_backup.yml"
      when:
        - allow_device_connections | default(false) | bool
        - not ansible_check_mode
