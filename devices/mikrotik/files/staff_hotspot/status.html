<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connection Status | Staff Wi-Fi</title>
  <link rel="stylesheet" href="portal-style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Wi-Fi Access</p>
      <h1 id="page-title">Staff Wi-Fi</h1>
      <p class="subtitle">Your connection is active.</p>
      <dl class="status-grid">
        <div><dt>Username</dt><dd>$(username)</dd></div>
        <div><dt>IP Address</dt><dd>$(ip)</dd></div>
      </dl>
      <a class="button secondary" href="$(link-logout)">Sign Out</a>
    </section>
  </main>
</body>
</html>
