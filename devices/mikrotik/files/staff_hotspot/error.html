<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign-in Error | Staff Wi-Fi</title>
  <link rel="stylesheet" href="portal-style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Wi-Fi Access</p>
      <h1 id="page-title">Staff Wi-Fi</h1>
      <p class="subtitle">Unable to sign in. Please try again.</p>
      <div class="alert" role="alert">$(error)</div>
      <a class="button" href="$(link-login)">Return to Sign In</a>
    </section>
  </main>
</body>
</html>
