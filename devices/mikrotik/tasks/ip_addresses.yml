---
- name: Check existing VLAN IP addresses
  community.routeros.command:
    commands:
    - /ip address print count-only where interface={{ item.interface }}
  loop: '{{ mikrotik_vlan_addresses }}'
  register: address_checks
  changed_when: false
  loop_control:
    label: '{{ item.interface }}'
- name: Add missing VLAN IP addresses
  community.routeros.command:
    commands:
    - /ip address add address={{ item.item.address }} interface={{ item.item.interface }} comment="{{ item.item.comment
      }}" disabled=no
  loop: '{{ address_checks.results }}'
  when:
  - item.stdout_lines[0][-1] | trim == "0"
  loop_control:
    label: '{{ item.item.interface }}'
  changed_when: true
- name: Enforce VLAN IP-address settings
  community.routeros.command:
    commands:
    - /ip address set [find where interface={{ item.interface }}] address={{ item.address }} comment="{{ item.comment
      }}" disabled=no
  loop: '{{ mikrotik_vlan_addresses }}'
  changed_when: true
  loop_control:
    label: '{{ item.interface }}'
- name: Read configured IP addresses
  community.routeros.command:
    commands:
    - /ip address print detail without-paging
  register: configured_addresses
  changed_when: false
- name: Display configured IP addresses
  ansible.builtin.debug:
    var: configured_addresses.stdout_lines
